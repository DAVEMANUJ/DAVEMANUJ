<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="DAVEMANUJ active game dev dashboard banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#060816"/>
      <stop offset="45%" stop-color="#0d1b3d"/>
      <stop offset="100%" stop-color="#2a0d38"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7dd3fc"/>
      <stop offset="70%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity=".55"/>
    </filter>
    <style>
      .ttl{font:700 58px 'Segoe UI',Verdana,sans-serif;letter-spacing:7px}
      .sub{font:600 19px 'Segoe UI',Verdana,sans-serif;letter-spacing:3px}
      .txt{font:500 17px 'Segoe UI',Verdana,sans-serif;letter-spacing:1.5px}
      .mono{font:700 18px 'Consolas','Courier New',monospace;letter-spacing:2px}
      .scan{animation:scan 7s linear infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .float{animation:float 4.8s ease-in-out infinite}
      .bars1{animation:bars 2.1s ease-in-out infinite}
      .bars2{animation:bars 2.1s ease-in-out infinite .22s}
      .bars3{animation:bars 2.1s ease-in-out infinite .44s}
      .bars4{animation:bars 2.1s ease-in-out infinite .66s}
      .bars5{animation:bars 2.1s ease-in-out infinite .88s}
      .blink{animation:blink 1.1s step-end infinite}
      @keyframes scan{0%{transform:translateX(-260px)}100%{transform:translateX(1240px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes bars{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <g opacity=".16">
    <path d="M0 290H1200M0 250H1200M0 210H1200M0 170H1200M0 130H1200M0 90H1200" stroke="#7dd3fc" stroke-width="1.2"/>
    <path d="M120 0V360M240 0V360M360 0V360M480 0V360M600 0V360M720 0V360M840 0V360M960 0V360M1080 0V360" stroke="#7dd3fc" stroke-width=".9"/>
  </g>
  <g class="scan" opacity=".18">
    <rect x="0" y="0" width="180" height="360" fill="#67e8f9"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="46" y="42" width="718" height="188" rx="24" fill="#0b1225cc" stroke="#7dd3fc55"/>
    <text x="82" y="108" class="ttl" fill="url(#glow)">DAVEMANUJ</text>
    <text x="84" y="145" class="sub" fill="#dbeafe">ACTIVE GAME-DEV DASHBOARD</text>
    <text x="84" y="179" class="txt" fill="#93c5fd">Gameplay systems, animated frontend engineering, practical tools, clean execution.</text>
    <text x="84" y="208" class="mono blink" fill="#f9a8d4">BOOT STATUS :: READY</text>
  </g>
  <g transform="translate(56 252)">
    <rect width="218" height="56" rx="16" fill="#0f172acc" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="18" y="24" class="txt" fill="#bae6fd">PLAYER HUD</text>
    <text x="18" y="42" class="mono" fill="#ffffff">LVL 12  |  STREAK 14  |  REPOS 6</text>
  </g>
  <g transform="translate(294 252)">
    <rect width="214" height="56" rx="16" fill="#0f172acc" stroke="#818cf8" stroke-opacity=".45"/>
    <text x="18" y="24" class="txt" fill="#c7d2fe">CORE BUILD</text>
    <text x="18" y="42" class="mono" fill="#ffffff">UNITY 6  |  C#  |  MOTION UI</text>
  </g>
  <g transform="translate(528 252)">
    <rect width="236" height="56" rx="16" fill="#0f172acc" stroke="#f472b6" stroke-opacity=".45"/>
    <text x="18" y="24" class="txt" fill="#fbcfe8">SYSTEM STATE</text>
    <text x="18" y="42" class="mono" fill="#ffffff">GAME FEEL  |  SHIP MODE  |  ONLINE</text>
  </g>
  <g class="float" filter="url(#shadow)">
    <rect x="818" y="48" width="332" height="264" rx="26" fill="#081120d9" stroke="#67e8f955"/>
    <text x="850" y="90" class="sub" fill="#e2e8f0">SYSTEM TELEMETRY</text>
    <rect x="850" y="114" width="268" height="86" rx="16" fill="#0d172d"/>
    <path d="M866 178L904 160 938 166 978 136 1018 146 1058 124 1102 138" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="904" cy="160" r="4" fill="#67e8f9"/>
    <circle cx="978" cy="136" r="4" fill="#60a5fa"/>
    <circle cx="1058" cy="124" r="4" fill="#f472b6"/>
    <text x="852" y="224" class="txt" fill="#93c5fd">QUEST PROGRESS</text>
    <rect x="850" y="236" width="270" height="18" rx="9" fill="#172554"/>
    <rect x="850" y="236" width="216" height="18" rx="9" fill="#38bdf8" class="pulse"/>
    <text x="1078" y="250" class="mono" fill="#ffffff">80%</text>
    <text x="852" y="286" class="txt" fill="#fbcfe8">AUDIO / FEEL / SYSTEMS / UI</text>
  </g>
  <g transform="translate(840 322)">
    <rect x="0" y="-34" width="14" height="34" rx="5" fill="#22d3ee" class="bars1"/>
    <rect x="22" y="-48" width="14" height="48" rx="5" fill="#38bdf8" class="bars2"/>
    <rect x="44" y="-60" width="14" height="60" rx="5" fill="#60a5fa" class="bars3"/>
    <rect x="66" y="-42" width="14" height="42" rx="5" fill="#818cf8" class="bars4"/>
    <rect x="88" y="-54" width="14" height="54" rx="5" fill="#f472b6" class="bars5"/>
  </g>
</svg>
