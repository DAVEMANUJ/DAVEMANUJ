<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 180" role="img" aria-label="DAVEMANUJ name banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#050816"/>
      <stop offset="50%" stop-color="#0c1c3f"/>
      <stop offset="100%" stop-color="#240b33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#7dd3fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      .ttl{font:700 68px 'Segoe UI',Verdana,sans-serif;letter-spacing:8px}
      .scan{animation:scan 6.8s linear infinite}
      .glow{animation:pulse 2.6s ease-in-out infinite}
      @keyframes scan{0%{transform:translateX(-240px)}100%{transform:translateX(1240px)}}
      @keyframes pulse{0%,100%{opacity:.65}50%{opacity:1}}
    </style>
  </defs>
  <rect width="1200" height="180" rx="24" fill="url(#bg)"/>
  <g opacity=".14">
    <path d="M0 132H1200M0 96H1200M0 60H1200" stroke="#67e8f9" stroke-width="1.1"/>
    <path d="M120 0V180M240 0V180M360 0V180M480 0V180M600 0V180M720 0V180M840 0V180M960 0V180M1080 0V180" stroke="#67e8f9" stroke-width=".8"/>
  </g>
  <g class="scan" opacity=".14">
    <rect x="0" y="0" width="180" height="180" fill="#67e8f9"/>
  </g>
  <text x="600" y="102" text-anchor="middle" class="ttl glow" fill="url(#title)">DAVEMANUJ</text>
</svg>
