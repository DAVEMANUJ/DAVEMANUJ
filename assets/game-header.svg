<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="DAVEMANUJ game developer banner">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#081120"/>
      <stop offset="50%" stop-color="#132b52"/>
      <stop offset="100%" stop-color="#25103d"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#6ee7ff" stop-opacity=".7"/>
      <stop offset="100%" stop-color="#6ee7ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="titleGlow" x1="0" x2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#8be9ff"/>
      <stop offset="100%" stop-color="#ff87c5"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity=".45"/>
    </filter>
    <style>
      .title{font:700 54px 'Segoe UI',Verdana,sans-serif;letter-spacing:6px}
      .sub{font:600 20px 'Segoe UI',Verdana,sans-serif;letter-spacing:3px}
      .small{font:500 18px 'Segoe UI',Verdana,sans-serif;letter-spacing:2px}
      .scan{animation:scan 6s linear infinite}
      .pulse{animation:pulse 2.6s ease-in-out infinite}
      .float{animation:float 4s ease-in-out infinite}
      .float2{animation:float 5s ease-in-out infinite .6s}
      .blink{animation:blink 1.2s step-end infinite}
      .bar1{animation:bar 2.4s ease-in-out infinite}
      .bar2{animation:bar 2.4s ease-in-out infinite .35s}
      .bar3{animation:bar 2.4s ease-in-out infinite .7s}
      .bar4{animation:bar 2.4s ease-in-out infinite 1.05s}
      @keyframes scan{0%{transform:translateX(-220px)}100%{transform:translateX(1220px)}}
      @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes blink{50%{opacity:0}}
      @keyframes bar{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <g opacity=".22">
    <path d="M0 250H1200" stroke="#6ee7ff" stroke-width="2"/>
    <path d="M0 220H1200" stroke="#6ee7ff" stroke-width="1.5"/>
    <path d="M0 190H1200" stroke="#6ee7ff" stroke-width="1.2"/>
    <path d="M0 160H1200" stroke="#6ee7ff" stroke-width="1"/>
    <path d="M0 130H1200" stroke="#6ee7ff" stroke-width=".8"/>
    <path d="M120 0V320M240 0V320M360 0V320M480 0V320M600 0V320M720 0V320M840 0V320M960 0V320M1080 0V320" stroke="#6ee7ff" stroke-width=".8"/>
  </g>
  <g class="scan" opacity=".22">
    <rect x="0" y="0" width="180" height="320" fill="url(#gridGlow)"/>
  </g>
  <g filter="url(#soft)">
    <rect x="58" y="50" width="700" height="162" rx="22" fill="#0f172acc" stroke="#7dd3fc44"/>
    <text x="92" y="112" class="title" fill="url(#titleGlow)">DAVEMANUJ</text>
    <text x="94" y="148" class="sub" fill="#dbeafe">INDIE GAME DEVELOPER  •  FRONTEND ENGINEER</text>
    <text x="94" y="180" class="small" fill="#93c5fd">Gameplay systems, animated UI, practical tools, clean execution.</text>
    <text x="94" y="207" class="small blink" fill="#f9a8d4">PRESS START TO BUILD SOMETHING ALIVE</text>
  </g>
  <g transform="translate(855 64)" class="float">
    <rect x="0" y="0" width="238" height="142" rx="18" fill="#081120cc" stroke="#67e8f9" stroke-opacity=".45"/>
    <rect x="18" y="18" width="202" height="74" rx="10" fill="#0f1b31"/>
    <path d="M32 78L60 58 85 69 112 40 138 50 168 30 206 46" fill="none" stroke="#6ee7ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="60" cy="58" r="4" fill="#6ee7ff"/>
    <circle cx="112" cy="40" r="4" fill="#8b5cf6"/>
    <circle cx="168" cy="30" r="4" fill="#f472b6"/>
    <text x="18" y="114" class="small" fill="#e2e8f0">SYSTEMS  /  FEEL  /  SHIP</text>
  </g>
  <g transform="translate(846 214)" opacity=".95">
    <rect x="0" y="0" width="14" height="46" rx="5" fill="#67e8f9" class="bar1"/>
    <rect x="22" y="-10" width="14" height="56" rx="5" fill="#60a5fa" class="bar2"/>
    <rect x="44" y="-20" width="14" height="66" rx="5" fill="#8b5cf6" class="bar3"/>
    <rect x="66" y="-2" width="14" height="48" rx="5" fill="#f472b6" class="bar4"/>
  </g>
  <g transform="translate(938 218)" class="float2">
    <rect x="0" y="0" width="134" height="42" rx="21" fill="#111827cc" stroke="#f472b6" stroke-opacity=".42"/>
    <text x="18" y="27" class="small" fill="#fdf2f8">GAME FEEL</text>
  </g>
</svg>
