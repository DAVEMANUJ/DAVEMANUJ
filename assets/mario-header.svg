<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" role="img" aria-label="DAVEMANUJ Mario portfolio banner">
  <defs>
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#c8f4ff"/>
      <stop offset="65%" stop-color="#64cfff"/>
      <stop offset="65%" stop-color="#7ddb72"/>
      <stop offset="100%" stop-color="#7ddb72"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#091629" flood-opacity=".18"/>
    </filter>
    <style>
      .p{font-family:'Trebuchet MS',Verdana,sans-serif}
      .pix{font-family:'Courier New',monospace;font-weight:700;letter-spacing:3px}
      .cloud{animation:cloud 14s linear infinite}
      .cloud.s2{animation-duration:19s;animation-delay:-6s}
      .cloud.s3{animation-duration:24s;animation-delay:-11s}
      .coin{animation:bob 1.3s ease-in-out infinite}
      .coin.c2{animation-delay:.35s}
      .coin.c3{animation-delay:.7s}
      .mario{animation:run 5s linear infinite}
      .blink{animation:blink 1s step-end infinite}
      @keyframes cloud{from{transform:translateX(-130px)}to{transform:translateX(1260px)}}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
      @keyframes run{0%{transform:translateX(0)}100%{transform:translateX(860px)}}
      @keyframes blink{50%{opacity:0}}
    </style>
  </defs>
  <rect width="1200" height="320" rx="22" fill="url(#sky)"/>
  <g opacity=".95">
    <g class="cloud"><rect x="0" y="54" width="86" height="28" rx="14" fill="#fff"/><rect x="20" y="36" width="38" height="28" rx="14" fill="#fff"/><rect x="46" y="46" width="42" height="30" rx="15" fill="#fff"/></g>
    <g class="cloud s2"><rect x="0" y="102" width="96" height="30" rx="15" fill="#fff"/><rect x="26" y="82" width="42" height="30" rx="15" fill="#fff"/><rect x="58" y="92" width="44" height="32" rx="16" fill="#fff"/></g>
    <g class="cloud s3"><rect x="0" y="70" width="88" height="28" rx="14" fill="#fff"/><rect x="18" y="50" width="38" height="28" rx="14" fill="#fff"/><rect x="48" y="60" width="42" height="30" rx="15" fill="#fff"/></g>
  </g>
  <circle cx="1035" cy="70" r="34" fill="#ffd53c"/>
  <g filter="url(#shadow)">
    <rect x="58" y="42" width="708" height="174" rx="22" fill="#ffffff" fill-opacity=".82"/>
    <text x="92" y="102" class="pix" font-size="46" fill="#182340">DAVEMANUJ</text>
    <text x="94" y="138" class="p" font-size="22" fill="#284064">INDIE GAME DEVELOPER • FRONTEND ENGINEER • SYSTEMS BUILDER</text>
    <text x="94" y="178" class="p" font-size="28" fill="#1d2f50">Playable software, Unity systems, animated UI, and useful tools.</text>
    <text x="94" y="212" class="pix blink" font-size="18" fill="#d84d33">PRESS START TO RUN THE PORTFOLIO</text>
  </g>
  <g class="coin"><circle cx="816" cy="96" r="18" fill="#ffc928" stroke="#bb7d00" stroke-width="4"/><text x="806" y="103" class="pix" font-size="14" fill="#8b5a00">$</text></g>
  <g class="coin c2"><circle cx="866" cy="86" r="18" fill="#ffc928" stroke="#bb7d00" stroke-width="4"/><text x="856" y="93" class="pix" font-size="14" fill="#8b5a00">$</text></g>
  <g class="coin c3"><circle cx="916" cy="96" r="18" fill="#ffc928" stroke="#bb7d00" stroke-width="4"/><text x="906" y="103" class="pix" font-size="14" fill="#8b5a00">$</text></g>
  <g transform="translate(0 0)">
    <rect x="0" y="248" width="1200" height="72" fill="#7d4a20"/>
    <rect x="0" y="248" width="1200" height="18" fill="#bb7436"/>
    <g fill="#9d5e2a">
      <rect x="34" y="270" width="54" height="20"/><rect x="138" y="270" width="54" height="20"/><rect x="242" y="270" width="54" height="20"/><rect x="346" y="270" width="54" height="20"/><rect x="450" y="270" width="54" height="20"/><rect x="554" y="270" width="54" height="20"/><rect x="658" y="270" width="54" height="20"/><rect x="762" y="270" width="54" height="20"/><rect x="866" y="270" width="54" height="20"/><rect x="970" y="270" width="54" height="20"/><rect x="1074" y="270" width="54" height="20"/>
    </g>
  </g>
  <g>
    <g transform="translate(700 190)">
      <rect width="88" height="58" rx="8" fill="#b96e31" stroke="#6f3c17" stroke-width="4"/>
      <rect x="8" y="8" width="72" height="10" fill="#8d4f1f"/><rect x="8" y="40" width="72" height="10" fill="#8d4f1f"/>
      <text x="18" y="34" class="pix" font-size="12" fill="#ffe3b5">TYPE</text>
    </g>
    <g transform="translate(806 172)">
      <rect width="88" height="76" rx="8" fill="#b96e31" stroke="#6f3c17" stroke-width="4"/>
      <rect x="8" y="8" width="72" height="10" fill="#8d4f1f"/><rect x="8" y="58" width="72" height="10" fill="#8d4f1f"/>
      <text x="12" y="40" class="pix" font-size="12" fill="#ffe3b5">ANI</text>
    </g>
    <g transform="translate(912 182)">
      <rect width="88" height="66" rx="8" fill="#b96e31" stroke="#6f3c17" stroke-width="4"/>
      <rect x="8" y="8" width="72" height="10" fill="#8d4f1f"/><rect x="8" y="48" width="72" height="10" fill="#8d4f1f"/>
      <text x="12" y="36" class="pix" font-size="11" fill="#ffe3b5">SKILL</text>
    </g>
  </g>
  <g class="mario" transform="translate(694 140)">
    <rect x="18" y="0" width="28" height="10" fill="#da4431"/>
    <rect x="12" y="10" width="40" height="18" fill="#f8d3ac"/>
    <rect x="8" y="18" width="18" height="10" fill="#3b1d12"/>
    <rect x="8" y="30" width="24" height="24" fill="#da4431"/>
    <rect x="34" y="30" width="24" height="24" fill="#da4431"/>
    <rect x="14" y="32" width="32" height="16" fill="#175fd4"/>
    <rect x="14" y="54" width="14" height="28" fill="#175fd4"/>
    <rect x="38" y="54" width="14" height="28" fill="#175fd4"/>
    <rect x="8" y="80" width="20" height="8" fill="#7a3f04"/>
    <rect x="38" y="80" width="20" height="8" fill="#7a3f04"/>
    <rect x="0" y="38" width="12" height="16" fill="#f8d3ac"/>
    <rect x="58" y="40" width="12" height="16" fill="#f8d3ac"/>
  </g>
</svg>
